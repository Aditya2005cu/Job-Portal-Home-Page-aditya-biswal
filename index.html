    <h1>job portal</h1>
    <p>Welcome to the Job Portal. Find your dream job here!</p>

<hr>

<section class="search-section">
    <h2>Search your dream job</h2>
    <div class="search-bar">
        <select id="job-category" class="input-field">
            <option value="all">all catogaries</option>
            <option value="it">IT</option>
            <option value="finance">Finance</option>
            <option value="healthcare">Healthcare</option>
            <option value="education">Education</option>
            <option value="full-stack">full stack developer</option>
        </select>

        <input type="text" id="skills" class="input-field" placeholder="Enter your skills (comma separated)">
        <input type="text" id="location" class="input-field" placeholder="Enter City or Country">
        <button onclick="revealJobs()" class="search-btn">Search Jobs 🚀</button>



    </div>
</section>
<hr>

<section id="job-results" class="result-section" style="display: none;">
    <h2>Available jobs</h2>
    <div class="job-list" id="dynamic-job-list">
        </div>
</section>
